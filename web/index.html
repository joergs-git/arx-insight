<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARX Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#131519;--panel:#1B1E24;--panel2:#23272F;--ink:#F0EEE9;--ink2:#B3B8C1;--ink3:#7D828C;
    --rule:#2B2F38;--rule2:#3A3F4A;--accent:#FF6A52;--good:#3FC6AE;--warn:#E0A13E;--warn-bg:#2A2212;--fc:#B18BEA;--grid:#262A32;
    --disp:'Oswald',Impact,system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.55;-webkit-text-size-adjust:100%}
  h1,h2,h3{font-family:var(--disp);font-weight:700;line-height:1.05;margin:0;text-transform:uppercase}
  button{font-family:var(--body);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:1100px;margin:0 auto;padding:0 22px}
  .num{font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:700}
  input{font-family:var(--body)}
  .btn{border:2px solid var(--accent);background:var(--accent);color:#fff;font-size:21px;font-weight:600;
    padding:16px 26px;border-radius:10px;min-height:60px}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule2)}
  .btn:active{transform:translateY(1px)}

  .screen{display:none;min-height:100vh}
  .screen.active{display:block}

  /* ---- SETUP + GOAL centered cards ---- */
  .center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 22px}
  .card{background:var(--panel);border:2px solid var(--rule);border-radius:14px;padding:30px;width:min(680px,94vw)}
  .card h2{font-size:32px;margin-bottom:6px}
  .card .sub{color:var(--ink2);margin-bottom:22px}
  .field{margin-bottom:22px}
  .field label{display:block;font-family:var(--disp);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
  .field input[type=text],.field input[type=password],.field input[type=number]{
    width:100%;font-size:21px;padding:15px 16px;border:2px solid var(--rule2);border-radius:10px;background:var(--panel2);color:var(--ink);min-height:58px}
  .segbig{display:flex;gap:10px;flex-wrap:wrap}
  .segbig button{flex:1;min-width:120px;min-height:60px;border:2px solid var(--rule2);background:var(--panel2);color:var(--ink2);
    font-size:19px;font-weight:600;border-radius:10px}
  .segbig button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* ---- SEARCH ---- */
  #search .center{gap:18px}
  .logo{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase}
  .bigsearch{width:min(760px,94vw)}
  .bigsearch input{width:100%;font-size:30px;padding:22px 24px;border:3px solid var(--rule2);border-radius:14px;background:var(--panel);color:var(--ink);min-height:78px;text-align:center}
  .results{width:min(760px,94vw);display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .urow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--panel);border:2px solid var(--rule);
    border-radius:12px;padding:18px 22px;min-height:72px;text-align:left;color:var(--ink)}
  .urow .un{font-family:var(--disp);font-size:26px;font-weight:600}
  .urow .um{font-size:15px;color:var(--ink3)}
  .urow:active{border-color:var(--accent)}

  /* ---- GOAL sliders ---- */
  .poles{display:flex;justify-content:space-between;font-family:var(--disp);font-size:18px;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
  input[type=range]{width:100%;height:44px;-webkit-appearance:none;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--good),var(--accent))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:#fff;border:4px solid var(--accent);margin-top:-15px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
  .mix{display:flex;gap:14px;margin-top:8px}
  .mixv{flex:1;text-align:center;background:var(--panel2);border:2px solid var(--rule);border-radius:10px;padding:12px}
  .mixv .k{font-family:var(--disp);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
  .mixv .v{font-family:var(--disp);font-size:34px;font-weight:700}

  /* ---- REPORT (reuses PoC visual language) ---- */
  .topbar{position:sticky;top:0;z-index:9;background:var(--panel);border-bottom:2px solid var(--ink);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px}
  .topbar .who{font-family:var(--disp);font-size:26px;font-weight:700;text-transform:uppercase}
  .topbar .meta{color:var(--ink3);font-size:15px}
  .topbar .spacer{flex:1}
  .topbar .btn{font-size:18px;padding:12px 18px;min-height:52px}
  section{padding-block:44px 4px}
  .eyebrow{font-family:var(--disp);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .eyebrow::after{content:"";flex:1;height:2px;background:var(--rule)}
  h2.sec{font-size:clamp(25px,4vw,38px);margin-bottom:8px}
  .lead{font-size:19px;color:var(--ink2);max-width:66ch;margin:0 0 16px}.lead b{color:var(--ink)}
  .panel{background:var(--panel);border:2px solid var(--rule);border-radius:8px;padding:18px}
  .panel table td{padding:7px 8px;border-bottom:1px solid var(--rule)}
  .panel table td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--disp);font-weight:600}
  .chartwrap{overflow-x:auto}
  svg{display:block;width:100%;height:auto;font-family:var(--disp)}svg text{font-variant-numeric:tabular-nums}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--rule);border:2px solid var(--ink)}
  .kpi{background:var(--panel);padding:16px 18px}.kpi .label{font-family:var(--disp);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
  .kpi .val{font-family:var(--disp);font-weight:700;font-size:clamp(32px,5vw,52px);line-height:1}.kpi .val small{font-size:.4em;color:var(--ink3)}
  .kpi.hot .val{color:var(--accent)}
  @media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .legend{display:flex;gap:20px;flex-wrap:wrap;font-size:15px;color:var(--ink2);margin-top:10px}
  .legend span{display:inline-flex;align-items:center;gap:7px}.dot{width:14px;height:4px;border-radius:2px}.dot.r{width:14px;height:14px;border-radius:50%}
  .verdict{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;border-left:8px solid var(--warn);background:var(--warn-bg);border-radius:6px;padding:20px 22px;margin-top:16px}
  .verdict .big{font-family:var(--disp);font-weight:700;font-size:clamp(42px,8vw,66px);color:var(--warn);line-height:.9}.verdict .big small{display:block;font-size:.26em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
  .verdict p{margin:0;font-size:19px}.verdict p b{font-weight:600}
  @media(max-width:560px){.verdict{grid-template-columns:1fr}}
  .exhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .seg{display:inline-flex;border:2px solid var(--rule2);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:var(--panel);color:var(--ink2);font-size:18px;font-weight:600;padding:0 20px;min-height:56px}
  .seg button[aria-pressed=true]{background:var(--accent);color:#fff}
  .grid-prog{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}@media(max-width:760px){.grid-prog{grid-template-columns:1fr}}
  .excard{background:var(--panel);border:2px solid var(--rule);border-radius:6px;padding:16px 18px}
  .excard .n{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .excard .exname{font-family:var(--disp);font-size:22px;font-weight:600;text-transform:uppercase}
  .excard .cur{font-family:var(--disp);font-weight:700;font-size:30px}.excard .cur small{font-size:.42em;color:var(--ink3)}
  .excard .meta{font-size:14px;color:var(--ink3);margin-top:2px}
  .grp{display:inline-block;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:4px;color:#fff}
  .grp.Drive{background:#C9552F}.grp.Push{background:#3E86A8}.grp.Pull{background:#5E9138}
  .chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--ink2);margin-left:6px}
  .chip.up{background:var(--good);color:#08110e}.chip.flat{background:var(--warn);color:#241a06}.chip.low{background:var(--panel2);color:var(--ink3)}
  ol.plan{list-style:none;counter-reset:p;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
  ol.plan li{counter-increment:p;background:var(--panel);border:2px solid var(--rule);display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:16px;padding:13px 18px}
  ol.plan li::before{content:counter(p);font-family:var(--disp);font-weight:700;font-size:32px;color:var(--accent);text-align:center}
  ol.plan .ex{font-family:var(--disp);font-size:22px;font-weight:600;text-transform:uppercase}
  ol.plan .cue{font-size:15px;color:var(--ink2)}ol.plan .tgt{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink3);white-space:nowrap}
  /* two-column report: main sections left, AI panel right; both scroll together */
  #r_body{max-width:min(1500px,92vw)}
  .report-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,34%);gap:34px;align-items:start}
  @media(max-width:1040px){.report-grid{grid-template-columns:1fr}}
  .who{font-family:var(--disp);font-size:26px;font-weight:700;text-transform:uppercase;background:none;border:0;color:var(--ink);padding:0;text-align:left;border-bottom:2px dashed transparent;cursor:pointer}
  .who:hover{border-bottom-color:var(--accent);color:var(--accent)}
  .banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--good-bg);border:2px solid var(--good);border-radius:8px;padding:14px 18px;margin:16px 0;font-size:17px}
  .banner b{color:var(--good)}
  /* AI panel — rich, readable, not a wall of text */
  .ai{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--rule2);border-radius:12px;padding:22px 24px;font-size:20px;line-height:1.6}
  .ai .aihdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .ai .aihdr h3{font-size:24px;text-transform:uppercase;color:var(--accent);margin:0}
  .ai .aihdr .badge{font-size:12px;color:var(--ink3);border:1px solid var(--rule2);border-radius:20px;padding:3px 10px}
  .ai h4{font-family:var(--disp);font-weight:700;font-size:21px;margin:20px 0 6px;display:flex;align-items:center;gap:9px}
  .ai h4:first-of-type{margin-top:4px}
  .ai p{margin:0 0 10px}
  .ai ul{margin:0 0 12px;padding-left:0;list-style:none}
  .ai li{position:relative;padding-left:26px;margin-bottom:8px}
  .ai li::before{content:"›";position:absolute;left:6px;color:var(--accent);font-weight:700}
  .ai b{color:var(--ink);font-weight:600}
  .ai .placeholder,.ai .spin{color:var(--ink3);font-size:18px}
  .foot{font-size:15px;color:var(--ink3)}footer{border-top:2px solid var(--rule);margin-top:40px;padding-block:24px 60px}
  .spin{display:inline-block;color:var(--ink3)}

  @media print{
    .topbar .btn,.topbar .spacer{display:none}
    .seg,.exhead .seg{display:none}
    body{background:#fff;color:#111}
    .panel,.excard,.ai,.kpi{border-color:#ccc}
    section{padding-block:18px}
    /* print in one column so the AI analysis is included after the report */
    .report-grid{grid-template-columns:1fr}
    #r_side{position:static;break-inside:avoid}
    .ai{background:#fff}
  }
</style>
</head>
<body>

<!-- SETUP -->
<div class="screen" id="setup"><div class="center">
  <div class="logo">ARX Insight</div>
  <div class="card">
    <h2 id="s_setup_h">Setup</h2>
    <div class="sub" id="s_setup_sub">One time. Saved permanently.</div>
    <div class="field"><label id="s_lang">Language</label>
      <div class="segbig" id="setLang"><button data-v="en" aria-pressed="true">English</button><button data-v="de" aria-pressed="false">Deutsch</button></div></div>
    <div class="field"><label id="s_units">Units</label>
      <div class="segbig" id="setUnits"><button data-v="imperial" aria-pressed="true">lb / inch</button><button data-v="metric" aria-pressed="false">kg / cm</button></div></div>
    <div class="field"><label id="s_freq">Sessions per week (default)</label>
      <input type="number" id="setFreq" min="1" max="7" value="2"></div>
    <div class="field"><label id="s_key">Anthropic API key (optional, for AI analysis)</label>
      <input type="password" id="setKey" placeholder="sk-ant-..."></div>
    <button class="btn" id="setupSave" style="width:100%">Save & start</button>
  </div>
</div></div>

<!-- SEARCH -->
<div class="screen" id="search"><div class="center">
  <div class="logo">ARX Insight</div>
  <div class="bigsearch"><input type="text" id="q" autocomplete="off" placeholder="Name suchen…"></div>
  <div class="results" id="results"></div>
</div></div>

<!-- GOAL -->
<div class="screen" id="goal"><div class="center">
  <div class="card">
    <h2 id="g_h">Trainingsziel</h2>
    <div class="sub" id="g_sub">Keine exakte Wissenschaft, nur die Richtung. Schieben, wohin es gehen soll.</div>
    <div class="field">
      <div class="poles"><span id="g_pole_str">Kraft</span><span id="g_pole_mus">Muskelaufbau</span></div>
      <input type="range" id="gMain" min="0" max="100" value="60">
    </div>
    <div class="field">
      <label id="g_cond">Ausdauer / Kondition beimischen</label>
      <input type="range" id="gCond" min="0" max="60" value="10">
    </div>
    <div class="field"><label id="g_freq">Trainings pro Woche</label>
      <input type="number" id="gFreq" min="1" max="7" value="2"></div>
    <div class="field" style="display:flex;gap:14px">
      <div style="flex:1"><label id="g_height">Größe (cm)</label><input type="number" id="gHeight" min="0" max="260" placeholder="–"></div>
      <div style="flex:1"><label id="g_weight">Gewicht (kg)</label><input type="number" id="gWeight" min="0" max="400" placeholder="–"></div>
    </div>
    <div class="field"><label id="g_focus_l">Fokus antippen (optional)</label>
      <div class="segbig" id="gFocus"></div></div>
    <div class="field"><label id="g_appr_l">Vorgehensweise</label>
      <div class="segbig" id="gAppr">
        <button data-v="auto" aria-pressed="true">Auto</button>
        <button data-v="full" aria-pressed="false">Ganzkörper</button>
        <button data-v="split" aria-pressed="false">Split</button></div></div>
    <div class="field"><label id="g_lang_l">Sprache dieses Profils</label>
      <div class="segbig" id="gLang">
        <button data-v="" aria-pressed="true">Standard</button>
        <button data-v="en" aria-pressed="false">English</button>
        <button data-v="de" aria-pressed="false">Deutsch</button></div></div>
    <div class="mix" id="gMix"></div>
    <button class="btn" id="goalSave" style="width:100%;margin-top:22px">Ziel speichern & Report</button>
  </div>
</div></div>

<!-- RESTRICTIONS -->
<div class="screen" id="limits"><div class="center">
  <div class="card">
    <h2 id="lim_h">Any restrictions right now?</h2>
    <div class="sub" id="lim_sub">Tap a body part if it is limited. The plan will not push it hard.</div>
    <div class="grid-prog" id="limTiles" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))"></div>
    <div style="display:flex;gap:12px;margin-top:22px">
      <button class="btn ghost" id="limNone" style="flex:1">No restrictions</button>
      <button class="btn" id="limSave" style="flex:1">Save & report</button>
    </div>
  </div>
</div></div>

<!-- REPORT -->
<div class="screen" id="report">
  <div class="topbar">
    <button class="who" id="r_name" title="Edit profile"></button>
    <button class="btn ghost" id="r_profile" title="Edit this athlete">✎</button>
    <div class="meta" id="r_meta"></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="r_settings">⚙</button>
    <button class="btn ghost" id="r_limits">⚠</button>
    <button class="btn ghost" id="r_pdf">PDF</button>
    <button class="btn" id="r_exit">Exit</button>
  </div>
  <main class="wrap" id="r_body"></main>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const api=(p)=>fetch(p).then(r=>r.json());
const post=(p,b)=>fetch(p,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json());
let CFG={language:"en",units:"imperial",sessions_per_week:2}, CUR=null, REPORT=null, XMODE="occ";
let HAS_KEY=false, UPDATE={}, CURVER="", SETTINGS_ORIGIN="search", GOAL_MODE="new";
let GLOBAL_LANG="en", PLANG="";   // device default language, and the current profile's override
let FOCUS={}, APPROACH="auto";
const KEY_URL="https://console.anthropic.com/settings/keys";
const REPO="https://github.com/joergs-git/arx-insight";
const FGROUPS=["Push","Pull","Drive"];
const FCYCLE=["normal","more","less","off"];
function flabel(s){const de=CFG.language==="de";return {normal:de?"normal":"normal",more:de?"mehr":"more",less:de?"weniger":"less",off:de?"aus":"off"}[s];}
function renderFocusTiles(){
  $("#gFocus").innerHTML=FGROUPS.map(g=>{
    const st=FOCUS[g]||"normal";
    const col=st==="off"?"var(--accent)":st==="less"?"var(--warn)":st==="more"?"var(--good)":"var(--rule2)";
    const on=st!=="normal";
    return `<button data-g="${g}" aria-pressed="${on}" style="${on?`border-color:${col};color:${col}`:''}">${g}<br><small style="font-weight:400">${flabel(st)}</small></button>`;
  }).join("");
}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// unit helpers (engine returns kg/cm; convert for display if imperial)
function uKg(v){return CFG.units==="imperial"?+(v*2.20462).toFixed(1):v;}
function uCm(v){return CFG.units==="imperial"?+(v/2.54).toFixed(1):v;}
const LKg=()=>CFG.units==="imperial"?"lb":"kg", LCm=()=>CFG.units==="imperial"?"in":"cm";

const STR={de:{setup:"Ersteinrichtung",save:"Speichern & Starten",searchph:"Name suchen…",created:"angelegt",
  sessions:"Sessions",curve:"Kraftkurve · Highlight",progress:"Fortschritt je Übung",ht:"Verlauf, Trend & Prognose",
  lastS:"Letzte Sessions",lastD:"Letzte Tage",wb:"Gesamtkörper-Faktor",planh:"Vorschlag nächste Einheit",aih:"KI-Auswertung",
  aitag:"Erzeugt mit deinem Schlüssel aus den Kennzahlen dieser Person.",loading:"lädt…",
  rise:"Anstieg",inroad:"Inroad"},
 en:{setup:"First-time setup",save:"Save & start",searchph:"Search name…",created:"created",
  sessions:"sessions",curve:"Force curve · highlight",progress:"Progress per exercise",ht:"History, trend & forecast",
  lastS:"Last sessions",lastD:"Last days",wb:"Whole-body factor",planh:"Next session suggestion",aih:"AI analysis",
  aitag:"Generated with your key from this person's metrics.",loading:"loading…",rise:"Rise",inroad:"Inroad"}};
const T=()=>STR[CFG.language];

function show(id){$$(".screen").forEach(s=>s.classList.toggle("active",s.id===id));window.scrollTo(0,0);}

// ---------- boot ----------
api("/api/bootstrap").then(b=>{
  CFG.language=b.language;CFG.units=b.units;CFG.sessions_per_week=b.sessions_per_week;
  GLOBAL_LANG=b.language; CURVER=b.version||""; HAS_KEY=!!b.has_key; UPDATE=b.update||{};
  if(!b.configured){openSettings("search");} else {show("search");$("#q").focus();}
});

// ---------- setup ----------
$$("#setLang button, #setUnits button").forEach(()=>{});
function segClick(sel,cb){$(sel).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;[...$(sel).children].forEach(x=>x.setAttribute("aria-pressed",x===b));cb(b.dataset.v);});}
segClick("#setLang",v=>{});segClick("#setUnits",v=>{});
function openSettings(origin){
  SETTINGS_ORIGIN=origin||"search";
  const de=CFG.language==="de";
  $("#s_setup_h").textContent=de?"Einstellungen":"Settings";
  $("#s_setup_sub").textContent=de?"Gilt für dieses Gerät. Jederzeit änderbar.":"Applies to this device. Changeable anytime.";
  $("#s_lang").textContent=de?"Sprache":"Language";
  $("#s_units").textContent=de?"Einheiten":"Units";
  $("#s_freq").textContent=de?"Trainings pro Woche (Standard)":"Sessions per week (default)";
  $("#s_key").innerHTML=(de?"Anthropic API-Schlüssel (für KI-Analyse) ":"Anthropic API key (for AI analysis) ")+`<a href="${KEY_URL}" target="_blank" rel="noopener" style="color:var(--accent);text-transform:none;letter-spacing:0">${de?'Schlüssel holen ↗':'get a key ↗'}</a>`;
  $("#setupSave").textContent=de?"Speichern":"Save";

function goalMix(){

  return {muscle:muscle/100,strength:strength/100,conditioning:cond/100};
}
function renderMix(){
  const de=CFG.language==="de", m=goalMix();

    .map(([k,v])=>`<div class="mixv"><div class="k">${k}</div><div class="v">${Math.round(v*100)}<small style="font-size:.4em">%</small></div></div>`).join("");
}

function restrHtml(rest){

  if(!active.length) return "";
  const de=CFG.language==="de";
  const nameOf=k=>{const b=BODYPARTS.find(x=>x[0]===k);return b?(de?b[1]:b[2]):k;};
  const chips=active.map(([k,v])=>{
    const col=v==="avoid"?"var(--accent)":"var(--warn)";
    return `<span class="grp" style="background:${col}">${nameOf(k)}: ${rlabel(v)}</span>`;}).join(" ");
  return `<section><div class="eyebrow" style="color:var(--warn)">${de?'Einschränkungen aktiv':'Restrictions active'}</div>
    <div class="verdict" style="border-left-color:var(--warn);background:var(--warn-bg)">
      <p style="margin:0">${de?'Betroffene Partien werden nicht voll belastet, betroffene Übungen werden geschont oder ausgelassen.':'Affected areas are not loaded to the max; affected exercises are eased or omitted.'}<br><span style="display:inline-flex;gap:8px;flex-wrap:wrap;margin-top:8px">${chips}</span></p>
    </div></section>`;
}

    return `<tr><td>${label}</td><td class="num">${ideal!=null?ideal+(unit||''):'—'}</td><td class="num" style="color:${act==null?'var(--ink3)':dev?'var(--warn)':'var(--good)'}">${act!=null?act+(unit||''):'—'}</td></tr>`;
  };
  return `<section><div class="eyebrow">${de?'Optimale Einstellungen':'Recommended settings'}</div>
   <h2 class="sec">${de?'Wissenschaftlich validierte Maschineneinstellung':'Science-based machine settings'}</h2>
   <p class="foot" style="margin:-2px 0 8px">${de?'Empfohlen für Muskel- und Kraftaufbau · rechts der zuletzt gezeigte Satz zum Vergleich.':'Recommended for muscle & strength · your featured set on the right for comparison.'}</p>
   <div class="panel"><table style="width:100%;border-collapse:collapse;font-size:18px">
     <tr class="foot"><td></td><td class="num">${de?'Empfohlen':'Recommended'}</td><td class="num">${de?'Dein Satz':'Your set'}</td></tr>

   </table>
   <p class="foot" style="margin-top:10px">${de?'Hinweis: Die 3-Sekunden-Halte am Endpunkt passt je nach Übungstyp nicht immer (z. B. manche Pressen).':'Note: the 3 s end-position hold does not suit every exercise type (e.g. some presses).'}</p></div></section>`;
}
function totalsHtml(tt){
  if(!tt) return "";
  const de=CFG.language==="de";
  const p=tt.projection||{};
  const tiles=[
    [de?"Reine Trainingszeit":"Time under load", (tt.total_time_under_load_min||0)+" min", de?"gesamt bisher":"total so far"],
    [de?"Ø je Einheit":"Avg per session", (tt.avg_session_wall_min||0)+" min", de?`davon ${tt.avg_session_tul_min||0} min unter Last`:`of it ${tt.avg_session_tul_min||0} min under load`],
    [de?"Einheiten":"Sessions", tt.sessions||0, de?"erfasst":"recorded"],
    [de?"Bewegte Arbeit":"Work done", (tt.total_work_impulse||0).toLocaleString(), de?"Impuls (kg·s)":"impulse (kg·s)"],
  ];
  const kpi=`<div class="kpis" style="margin-top:6px">`+tiles.map(([l,v,s])=>
    `<div class="kpi"><div class="label">${l}</div><div class="val">${v}</div><div class="foot" style="margin-top:4px">${s}</div></div>`).join("")+`</div>`;
  let projLine="";

    projLine=`<p class="foot" style="margin-top:12px">${de?'Hochgerechnet bei aktueller Frequenz':'Projected at current cadence'}: `+
      `<b>~${p.per_week_min} min/${de?'Woche':'week'}</b> · ~${p.per_month_min} min/${de?'Monat':'month'} · ~${p.per_year_h} h/${de?'Jahr':'year'}.</p>`;
  }
  return `<section><div class="eyebrow">${de?'Trainingszeit & Arbeit':'Training time & work'}</div>
    <h2 class="sec">${de?'Dein Aufwand in Zahlen':'Your effort in numbers'}</h2>${kpi}${projLine}</section>`;
}
function loadHtml(l,target){
  if(!l) return "";
  const de=CFG.language==="de";
  const map={overload_risk:[de?"Zu wenig Erholung":"Insufficient recovery","var(--accent)"],
             detraining_risk:[de?"Zu lange Pausen":"Detraining risk","var(--warn)"],
             underload:[de?"Reiz zu gering":"Under-stimulated","var(--warn)"],
             ok:[de?"Belastung ausgewogen":"Load balanced","var(--good)"]};
  const [label,col]=map[l.flag]||map.ok;
  const effL={deep:de?"maximal":"deep",moderate:de?"moderat":"moderate",submax:de?"submaximal":"sub-max",unknown:"—"};
  const groups=Object.entries(l.per_group).filter(([,v])=>v.days>0).map(([g,v])=>
    `<span class="grp ${g}">${g}</span> ${de?"letzte Einheit":"last session"} ${effL[v.last_effort]||'—'}${v.last_inroad!=null?` (${v.last_inroad}% Inroad)`:''}`).join(" &nbsp; ");
  const rate=l.weekly_rate!=null?l.weekly_rate:"—";
  const head=`${rate} <small style="font-size:.4em">${de?'Einheiten/Woche':'sessions/week'}</small>`;
  let expl;
  if(l.flag==="overload_risk") expl=de?`${l.insufficient_recovery_after_hard}× kurze Pause nach einer maximalen Einheit. Nach echter Ausbelastung 48–72 h Pause pro Muskelgruppe.`:`${l.insufficient_recovery_after_hard}× short rest after a maximal session. After true fatigue allow 48–72h per muscle group.`;
  else if(l.flag==="underload") expl=de?`Häufig trainiert, aber ${l.hard_sessions} wirklich maximale Einheiten. Kürzere Pausen sind hier ok – wichtiger ist mehr Intensität bis zum Inroad.`:`Frequent training but only ${l.hard_sessions} truly maximal sessions. Short rests are fine here — push to real inroad instead.`;
  else if(l.flag==="detraining_risk") expl=de?`Lange Pausen – Kraft kann abfallen.`:`Long gaps — strength may decline.`;
  else expl=de?`Ausbelastung und Erholung passen zusammen.`:`Effort and recovery are aligned.`;
  const sub=de?`Ziel ${target||2}/Woche · Abstände ${l.gaps_days.join(', ')} Tage · maximale Einheiten: ${l.hard_sessions}`
              :`Target ${target||2}/week · gaps ${l.gaps_days.join(', ')} days · maximal sessions: ${l.hard_sessions}`;
  return `<section><div class="eyebrow">${de?'Belastung & Erholung':'Load & recovery'}</div>
    <h2 class="sec">${de?'Trainingsabstände':'Session spacing'}</h2>
    <div class="verdict" style="border-left-color:${col};background:var(--panel)">
      <div class="big" style="color:${col}">${head}</div>
      <p><b style="color:${col}">${label}.</b> ${expl}<br><span class="foot">${sub}</span><br>${groups}</p>
    </div></section>`;
}
function drawCurve(){
  const F=REPORT.featured,W=1000,H=420,L=64,R=20,Tp=24,B=46;
  let c=F.curve; if(c.length>340){const st=Math.ceil(c.length/340);c=c.filter((_,i)=>i%st===0);}
  const tmax=c[c.length-1].t, fmax=Math.max(...c.map(p=>p.force_kg))*1.08;
  const x=v=>L+(v/tmax)*(W-L-R), y=v=>H-B-(v/fmax)*(H-Tp-B);
  const acc=css('--accent'),g=css('--grid'),i3=css('--ink3'),ink=css('--ink'),i2=css('--ink2');
  let s=`<defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${acc}" stop-opacity=".26"/><stop offset="1" stop-color="${acc}" stop-opacity=".02"/></linearGradient></defs>`;
  for(let i=0;i<=4;i++){const f=fmax*i/4,yy=y(f);s+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="${g}" stroke-width="1.5"/><text x="${L-10}" y="${yy+6}" text-anchor="end" font-size="19" fill="${i3}">${Math.round(uKg(f))}</text>`;}
  for(let tt=0;tt<=tmax;tt+=Math.ceil(tmax/6/5)*5){s+=`<text x="${x(tt)}" y="${H-B+28}" text-anchor="middle" font-size="18" fill="${i3}">${tt}s</text>`;}
  const path=c.map((p,i)=>`${i?'L':'M'}${x(p.t).toFixed(1)},${y(p.force_kg).toFixed(1)}`).join(" ");
  s+=`<path d="${path} L${x(tmax).toFixed(1)},${H-B} L${L},${H-B} Z" fill="url(#fl)"/><path d="${path}" fill="none" stroke="${acc}" stroke-width="3"/>`;
  const rp=F.rep_peaks,n=rp.length;rp.forEach((v,i)=>{const cx=x(tmax*(i+0.5)/n),cy=y(v);s+=`<circle cx="${cx}" cy="${cy}" r="6" fill="${css('--panel')}" stroke="${i2}" stroke-width="3"/><text x="${cx}" y="${cy-14}" text-anchor="middle" font-size="17" font-weight="600" fill="${ink}">${Math.round(uKg(v))}</text>`;});
  $("#curveSvg").innerHTML=s;
  // verdict
  const first=rp[0],peak=Math.max(...rp),last=rp[rp.length-1],rising=last>=first,t=T();
  $("#verdict").innerHTML=rising
   ?`<div class="big">+${Math.round((peak-first)/first*100)}%<small>${t.rise}</small></div><p>Kraft <b>stieg</b> über den Satz (${Math.round(uKg(first))}→${Math.round(uKg(peak))} ${LKg()}). Frühe Reps submaximal. Ab Rep 1 näher ans Maximum für echten Reiz.</p>`
   :`<div class="big">${F.inroad_pct}%<small>${t.inroad}</small></div><p>Kraft fiel um ${F.inroad_pct}% bis zur letzten Wiederholung. Tiefe Ausbelastung erreicht.</p>`;
}
function exChart(e){
  const W=460,H=190,L=44,R=14,Tp=14,B=30, occ=e.occ, useDay=XMODE==="day";
  const xs=occ.map((o,i)=>useDay?o.day:i), showFc=!useDay&&e.n>=3;
  const fc=showFc?e.forecast.map((v,k)=>({x:(occ.length-1)+(k+1),kg:v})):[];
  const allK=[...occ.map(o=>o.kg),...fc.map(p=>p.kg),e.pb];
  const xmax=Math.max(...xs,...fc.map(p=>p.x),1),xmin=Math.min(...xs,0);
  const kmax=Math.max(...allK)*1.08,kmin=Math.min(...allK,0)*0.9;
  const X=v=>L+((v-xmin)/((xmax-xmin)||1))*(W-L-R), Y=v=>H-B-((v-kmin)/((kmax-kmin)||1))*(H-Tp-B);
  const acc=css('--accent'),good=css('--good'),fcc=css('--fc'),i3=css('--ink3'),g=css('--grid');
  let s="";
  for(let i=0;i<=3;i++){const kv=kmin+(kmax-kmin)*i/3,yy=Y(kv);s+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="${g}" stroke-width="1.3"/><text x="${L-8}" y="${yy+5}" text-anchor="end" font-size="14" fill="${i3}">${Math.round(uKg(kv))}</text>`;}
  const hp=occ.map((o,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(o.kg).toFixed(1)}`).join(" ");
  s+=`<path d="${hp}" fill="none" stroke="${acc}" stroke-width="3"/>`;
  occ.forEach((o,i)=>s+=`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(o.kg).toFixed(1)}" r="3.5" fill="${acc}"/>`);
  if(e.n>=3){const b=e.trend_per_session,a=e.last-b*(occ.length-1);const i0=0,i1=occ.length-1;const x0=useDay?occ[0].day:0,x1=useDay?occ[occ.length-1].day:i1;
    s+=`<line x1="${X(x0).toFixed(1)}" y1="${Y(a+b*i0).toFixed(1)}" x2="${X(x1).toFixed(1)}" y2="${Y(a+b*i1).toFixed(1)}" stroke="${good}" stroke-width="2.5"/>`;}
  if(showFc){let fp=`M${X(occ.length-1).toFixed(1)},${Y(e.last).toFixed(1)}`;fc.forEach(p=>fp+=`L${X(p.x).toFixed(1)},${Y(p.kg).toFixed(1)}`);s+=`<path d="${fp}" fill="none" stroke="${fcc}" stroke-width="2.5" stroke-dasharray="6 5"/>`;}
  return `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
function renderProg(){const t=T();
  $("#prog").innerHTML=REPORT.exercises.map(e=>{
    let chip=e.n<3?`<span class="chip low">n=${e.n}</span>`:(e.trend_per_session>1?`<span class="chip up">▲ +${uKg(e.trend_per_session)}</span>`:(Math.abs(e.trend_per_session)<=1?`<span class="chip flat">≈ Plateau</span>`:`<span class="chip">${uKg(e.trend_per_session)}</span>`));
    let rb="";
    if(e.restriction==="careful")rb=`<span class="grp" style="background:var(--warn)">${rlabel('careful')}</span> `;
    else if(e.restriction==="avoid")rb=`<span class="grp" style="background:var(--accent)">${rlabel('avoid')}</span> `;
    return `<div class="excard"><div class="n"><span class="exname">${e.name}</span><span class="cur">${uKg(e.last)} <small>${LKg()}</small></span></div>
      <div class="meta"><span class="grp ${e.group}">${e.group}</span> ${rb}${e.n} ${t.sessions} · PB ${uKg(e.pb)} ${LKg()} ${chip}</div>${exChart(e)}</div>`;}).join("");
}
function drawWB(){const wb=REPORT.whole_body.series,W=1000,H=300,L=54,R=20,Tp=22,B=46;
  const X=i=>L+(wb.length<2?0.5:i/(wb.length-1))*(W-L-R),Y=v=>H-B-(v/100)*(H-Tp-B);
  const acc=css('--accent'),i3=css('--ink3'),g=css('--grid'),ink=css('--ink');let s="";
  for(let i=0;i<=4;i++){const v=25*i,yy=Y(v);s+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="${g}" stroke-width="1.5"/><text x="${L-10}" y="${yy+6}" text-anchor="end" font-size="18" fill="${i3}">${v}</text>`;}
  wb.forEach((w,i)=>s+=`<text x="${X(i)}" y="${H-B+28}" text-anchor="middle" font-size="16" fill="${i3}">${w.date}</text>`);
  const line=wb.map((w,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(w.index).toFixed(1)}`).join(" ");
  s+=`<defs><linearGradient id="wf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${acc}" stop-opacity=".24"/><stop offset="1" stop-color="${acc}" stop-opacity=".02"/></linearGradient></defs>`;
  s+=`<path d="${line} L${X(wb.length-1).toFixed(1)},${H-B} L${X(0).toFixed(1)},${H-B} Z" fill="url(#wf)"/><path d="${line}" fill="none" stroke="${acc}" stroke-width="3.5"/>`;
  wb.forEach((w,i)=>s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(w.index).toFixed(1)}" r="5" fill="${acc}"/><text x="${X(i).toFixed(1)}" y="${Y(w.index)-14}" text-anchor="middle" font-size="17" font-weight="600" fill="${ink}">${w.index}</text>`);
  $("#wbSvg").innerHTML=s;
}
function renderPlan(){const de=CFG.language==="de";
  const plan=REPORT.session_plan||[];
  if(!plan.length){
    const nx=(REPORT.load&&REPORT.load.next_earliest)||null;
    $("#plan").innerHTML=`<li style="grid-template-columns:1fr"><div><div class="ex">🛌 ${de?'Heute Ruhetag':'Rest day today'}</div>`+
      `<div class="cue">${de?'Die Autoregulation erkennt keine ausreichend erholte Muskelgruppe. Frühestens wieder':'Auto-regulation finds no sufficiently recovered muscle group. Earliest next session'} ${nx||'—'}.</div></div></li>`;
    return;
  }
  const cues=de?["Große Kette zuerst","Großer Druck","Großer Zug","Hintere Kette","Isolation zum Schluss"]:["Large chain first","Big push","Big pull","Posterior chain","Isolation last"];
  $("#plan").innerHTML=plan.map((o,i)=>{
    const careful=o.restriction==="careful";
    const cue=careful?(de?"Vorsichtig, submaximal, saubere Technik":"Gentle, sub-maximal, clean technique"):(cues[i]||'');
    const tgt=careful?(de?"1 Satz · vorsichtig":"1 set · gentle"):`1 ${de?'Satz':'set'} · ~${[3,3,3,2,2][i]||2} min`;
    const rb=careful?` <span class="grp" style="background:var(--warn)">${rlabel('careful')}</span>`:"";
    return `<li><div class="ex"><span class="grp ${o.group}">${o.group}</span> ${o.name}${rb}</div><div class="cue">${cue}</div><div class="tgt">${tgt}</div></li>`;}).join("");
}
// playful loading lines while the AI thinks
const SPIN_DE=["🤖💪 Die KI lässt die Muskeln spielen und studiert deine Kraftdaten …",
  "🧠🔥 Neuronen wärmen sich auf, Inroad wird vermessen … kurz durchatmen.",
  "📈 Zahlen werden gestemmt, Empfehlungen geschmiedet … ein paar Sekunden noch."];
const SPIN_EN=["🤖💪 The AI is flexing its neurons and studying your force data …",
  "🧠🔥 Warming up the synapses, measuring inroad … hold that pose.",
  "📈 Repping out the numbers, forging your recommendation … a few seconds."];
let SPIN_T=null;
function aiHeader(){const de=CFG.language==="de";return `<div class="aihdr"><span style="font-size:24px">🤖</span><h3>${T().aih}</h3><span class="badge">${de?'automatisch':'auto'}</span></div>`;}
function mdEmoji(s){s=s.toLowerCase();
  if(/erhol|recover|belast|load|pause|rest/.test(s))return'🛌';
  if(/ausbelast|inroad|effort|satz|quality|kurve|force/.test(s))return'🔥';
  if(/fortschritt|progress|kraft|strength|entwicklung/.test(s))return'📈';
  if(/gesamt|overall|index|körper|body/.test(s))return'🧍';
  if(/session|vorschlag|plan|next|einheit|empfehl/.test(s))return'🗓️';
  if(/schulter|knie|einschränk|restrict|shoulder|knee|note|safety|sicher/.test(s))return'⚠️';
  return'✨';}
function mdToHtml(md){
  const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const bold=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let html="",inList=false; const closeList=()=>{if(inList){html+="</ul>";inList=false;}};
  for(const raw of md.split(/\r?\n/)){
    const line=raw.trim(); if(!line){closeList();continue;} let m;
    if(m=line.match(/^#{1,6}\s+(.*)/)){closeList();html+=`<h4>${mdEmoji(m[1])} ${bold(m[1])}</h4>`;}
    else if(m=line.match(/^[-*•]\s+(.*)/)){if(!inList){html+="<ul>";inList=true;}html+=`<li>${bold(m[1])}</li>`;}
    else if(m=line.match(/^\d+[.)]\s+(.*)/)){if(!inList){html+="<ul>";inList=true;}html+=`<li>${bold(m[1])}</li>`;}
    else{closeList();html+=`<p>${bold(line)}</p>`;}
  }
  closeList(); return html;
}
function renderAISide(loading){
  const box=$("#aibox"); if(!box) return; const de=CFG.language==="de";
  if(SPIN_T){clearInterval(SPIN_T);SPIN_T=null;}
  if(loading){
    const lines=de?SPIN_DE:SPIN_EN; let i=0;
    const paint=()=>{box.innerHTML=aiHeader()+`<div class="spin">${lines[i%lines.length]}</div>`;i++;};
    paint(); SPIN_T=setInterval(paint,2600);
    return;
  }
  if(REPORT.ai_narrative){ box.innerHTML=aiHeader()+`<div class="badge" style="margin-bottom:12px">${T().aitag}</div>`+mdToHtml(REPORT.ai_narrative); return; }
  box.innerHTML=aiHeader()+`<div class="placeholder">${de?'Für die automatische KI-Analyse und die Empfehlung zur nächsten Einheit fehlt ein Claude API-Schlüssel. Trage ihn unter ⚙ Einstellungen ein.':'An AI analysis and next-session recommendation need a Claude API key. Add it under ⚙ Settings.'}<br><br><a href="${KEY_URL}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">${de?'Schlüssel bei Anthropic holen ↗':'Get a key from Anthropic ↗'}</a></div>`;
}
async function autoLoadAI(){
  if(REPORT.ai_narrative){ renderAISide(); return; }
  if(!HAS_KEY){ renderAISide(); return; }
  renderAISide(true);
  try{ const r=await api("/api/report?user_id="+CUR.id+"&ai=1"); REPORT.ai_narrative=r.ai_narrative||null; }
  catch(e){ REPORT.ai_narrative=null; }
  renderAISide();
}
